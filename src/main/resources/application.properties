spring.application.name=agentforge
server.port=${PORT:8080}

# Embedded H2 database stored on disk under ./data
spring.datasource.url=jdbc:h2:file:./data/agentforge;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=40MB
spring.mvc.async.request-timeout=-1

# AI service (Claude). Leave ANTHROPIC_API_KEY unset to run in rule-based mode.
agentforge.ai.model=${AGENTFORGE_MODEL:claude-opus-5-5}
agentforge.ai.effort=${AGENTFORGE_EFFORT:medium}
agentforge.storage.dir=./data/uploads
# Path or command name of the Tesseract OCR binary (optional)
agentforge.ocr.tesseract=${TESSERACT_CMD:tesseract}
# Geocoding through OpenStreetMap Nominatim (only used when the user supplies a location)
agentforge.geo.enabled=${AGENTFORGE_GEO:true}
agentforge.geo.base-url=https://nominatim.openstreetmap.org

# Always revalidate static files so UI updates show without a hard refresh
spring.web.resources.cache.cachecontrol.no-cache=true
