spring.application.name=agentforge
server.port=${PORT:8080}
# Behind a cloud load balancer (Render, Railway, Fly.io): trust X-Forwarded-* so links and cookies use https
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.compression.enabled=true

# Embedded H2 database and uploads, stored under AGENTFORGE_DATA_DIR (default ./data)
agentforge.data-dir=${AGENTFORGE_DATA_DIR:./data}
spring.datasource.url=jdbc:h2:file:${agentforge.data-dir}/agentforge;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=40MB
spring.mvc.async.request-timeout=-1

# AI service (Claude). Leave ANTHROPIC_API_KEY unset to run in rule-based mode.
agentforge.ai.model=${AGENTFORGE_MODEL:claude-opus-5-5}
agentforge.ai.effort=${AGENTFORGE_EFFORT:medium}
agentforge.storage.dir=${agentforge.data-dir}/uploads
# Path or command name of the Tesseract OCR binary (optional)
agentforge.ocr.tesseract=${TESSERACT_CMD:tesseract}
# Geocoding through OpenStreetMap Nominatim (only used when the user supplies a location)
agentforge.geo.enabled=${AGENTFORGE_GEO:true}
agentforge.geo.base-url=https://nominatim.openstreetmap.org
# Optional invite code: when set, new accounts can only be created with this code (protects a public deployment)
agentforge.signup-code=${AGENTFORGE_SIGNUP_CODE:}

# Always revalidate static files so UI updates show without a hard refresh
spring.web.resources.cache.cachecontrol.no-cache=true
